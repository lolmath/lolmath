stages:
  - comment
  - release

before_script:
  - npm install -g pnpm
  - pnpm i --frozen-lockfile

comment:
  image: node:lts
  stage: comment
  only:
    - merge_requests
  script: npx changesets-gitlab comment

release:
  image: node:lts
  stage: release
  only:
    - main
  script: npx changesets-gitlab
  variables:
    INPUT_PUBLISH: pnpm publish -r
