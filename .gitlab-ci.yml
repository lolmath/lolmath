comment:
  image: node:22
  needs: []
  only:
    - merge_requests
  script: npx -y changesets-gitlab comment

main:
  image: node:22
  needs: []
  script:
    - npm install -g pnpm
    - pnpm i --frozen-lockfile
    - pnpm run build
    - pnpm run lint
    - pnpm run test
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
      npx changesets-gitlab
      fi
    - pnpm run deploy
  variables:
    INPUT_PUBLISH: pnpm run changeset publish
    INPUT_REMOVE_SOURCE_BRANCH: "true"
