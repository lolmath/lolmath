stages:
  - comment
  - main

comment:
  image: node:20
  stage: comment
  only:
    - merge_requests
  script: npx -y changesets-gitlab comment

main:
  image:
    name: node:20
    pull_policy: if-not-present
  stage: main
  script:
    - npm install -g pnpm
    - pnpm i --frozen-lockfile
    - pnpm run build
    - pnpm run lint
    - pnpm run test
    - |
      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
      npx changesets-gitlab
      fi
    - pnpm run deploy
  variables:
    INPUT_PUBLISH: pnpm publish -r --no-git-checks
