stages:
  - comment
  - release

before_script:
  - npm install -g pnpm
  - pnpm i --frozen-lockfile

comment:
  image: node:lts-alpine
  stage: comment
  only:
    - merge_requests
  script: npm run changesets-gitlab comment

release:
  image: node:lts-alpine
  stage: release
  only:
    - main
  script: npm run changesets-gitlab
  variables:
    INPUT_PUBLISH: npm run release
